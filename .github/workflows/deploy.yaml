name: CI/CD Pipeline for pearl_thoughts

on:
  push:
    branches:
      - dev
      - feature/pipeline

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t srinidhi1368/yii2-app:latest .
          docker push srinidhi1368/yii2-app:latest

      - name: SSH and deploy on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull srinidhi1368/yii2-app:latest
            docker stack deploy -c /home/ubuntu/yii2-app/docker-compose.swarm.yml yii2app
            sudo systemctl reload nginx

